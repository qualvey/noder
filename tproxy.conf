sudo  nft add table inet m-tproxy

sudo nft "add chain inet m-tproxy prerouting {
type filter hook prerouting priority mangle;
policy accept;
}"

sudo nft add rule inet m-tproxy prerouting \
 ip daddr { \
    127.0.0.0/8,192.168.0.0/16, \
 } return

sudo nft add rule inet m-tproxy prerouting \
   meta mark 1024 return 

sudo nft add rule inet m-tproxy prerouting \
  meta l4proto tcp tproxy to :12345 meta mark set 1
  
sudo nft add rule inet m-tproxy prerouting \
  meta l4proto udp tproxy to :12345 meta mark set 1

sudo nft "add chain inet m-tproxy output {
  type route hook output priority mangle;
  policy accept
}"

sudo nft add rule inet m-tproxy output \
 meta nfproto ipv6 reject 
sudo nft add rule inet m-tproxy output \
  ip daddr { \
    127.0.0.0/8,192.168.0.0/16, \
 } return 
sudo nft add rule inet m-tproxy output \
 meta mark 1024 return

sudo nft add rule inet m-tproxy output \
  meta l4proto { tcp, udp }  \
  meta mark set 1

sudo ip rule add priority 10000 fwmark 1 lookup 100
sudo ip route replace local 0.0.0.0/0 dev lo table 100