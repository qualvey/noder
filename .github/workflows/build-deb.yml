name: Build Debian Packages

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (留空自动使用 Tag 或 1.0.0)'
        required: false
        default: ''

jobs:
  build:
    name: Build .deb (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils

      - name: Install Frontend Dependencies
        run: |
          cd web
          pnpm install --frozen-lockfile

      - name: Build Frontend & Debian Package
        run: |
          VERSION_ARG=""
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION_ARG="--version ${{ github.event.inputs.version }}"
          fi
          bash ./scripts/build-deb.sh --arch ${{ matrix.arch }} $VERSION_ARG

      - name: Verify Package Contents
        run: |
          DEB_FILE=$(ls dist/noder_*_${{ matrix.arch }}.deb)
          echo "Verifying $DEB_FILE..."
          dpkg-deb -I "$DEB_FILE"
          dpkg-deb -c "$DEB_FILE"

      - name: Upload Debian Artifact
        uses: actions/upload-artifact@v4
        with:
          name: noder-deb-${{ matrix.arch }}
          path: dist/*.deb

  release:
    name: Release .deb Packages
    needs: build
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.deb
          generate_release_notes: true
          # 检测 tag 是否包含 beta / alpha / rc，若包含则自动设为预发布
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
  deploy:
    name: Deploy to production
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: CD

    steps:
      - name: Download amd64 package
        uses: actions/download-artifact@v4
        with:
          name: noder-deb-amd64
          path: package

      - name: Copy package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "package/*.deb"
          target: "/tmp/noder-deploy"

      - name: Install and restart service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            sudo dpkg -i /tmp/noder-deploy/*.deb
            sudo systemctl daemon-reload
            sudo systemctl enable noder
            sudo systemctl restart noder
            sudo systemctl is-active --quiet noder
            rm -rf /tmp/noder-deploy