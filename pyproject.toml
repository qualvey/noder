[project]
name = "sub-server"
version = "0.5.0"
description = "Sing-Box Subscription Middleman API Server"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlmodel>=0.0.16",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
]
